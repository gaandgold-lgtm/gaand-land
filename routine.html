<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B3A8C">
<title>가앤 루틴 달력</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 디자인: 아이보리 바탕 + 보라 포인트. 위에서부터 오늘 미션 → 월 달력 → 분석 */
:root{
  --bg:#F6F3EE;
  --surface:#FFFFFF;
  --ink:#1F1B26;
  --muted:#7A7385;
  --line:#ECE7DF;
  --accent:#6A4C9C;
  --on-accent:#FFFFFF;
  --lav:#F2EEF8;
  --lav2:#DED4EE;
  --hero-a:#7B5CB3;
  --hero-b:#4B347A;
  --on-hero:#FBF7EE;
  --danger:#B3261E;
  --font:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16101E;--surface:#20172E;--ink:#F3EDF9;--muted:#A99BBC;--line:#34274A;
    --accent:#B9A0EA;--on-accent:#1A1124;--lav:#2C2140;--lav2:#3A2D54;--danger:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16101E;--surface:#20172E;--ink:#F3EDF9;--muted:#A99BBC;--line:#34274A;
  --accent:#B9A0EA;--on-accent:#1A1124;--lav:#2C2140;--lav2:#3A2D54;--danger:#FF8A80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font);letter-spacing:-.01em;-webkit-text-size-adjust:100%;min-height:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 1px 2px rgba(40,25,70,.04),0 8px 24px -18px rgba(40,25,70,.18)}

/* 상단 */
.top{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--on-hero);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:-.04em;flex:none}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0}
.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:1px}
.plan{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:36px;padding:0 12px;font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.gear{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1;padding:0}

/* 오늘 미션 */
.hero{border-radius:24px;padding:18px 16px 16px;color:var(--on-hero);background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.16),transparent 55%),linear-gradient(150deg,var(--hero-a),var(--hero-b));box-shadow:0 14px 30px -18px rgba(60,37,102,.8)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{font-size:13px;opacity:.8}
.hero h2{font-size:24px;font-weight:700;letter-spacing:-.025em;margin-top:2px;text-wrap:balance}
.hero h2 em{font-style:normal;color:#FFE9A8}
.left{flex:none;text-align:center;background:rgba(255,255,255,.14);border-radius:16px;padding:8px 14px;min-width:74px}
.left b{display:block;font-size:30px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.left span{font-size:11px;opacity:.85}
.pbar{height:8px;border-radius:999px;background:rgba(255,255,255,.2);margin:14px 0 12px;overflow:hidden}
.pbar i{display:block;height:100%;background:#FFE9A8;border-radius:999px;transition:width .3s ease}
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 12px;border-radius:14px;border:0;background:rgba(255,255,255,.12);text-align:left;color:var(--on-hero);transition:background .2s}
.trow .em{font-size:20px;flex:none}
.trow .tx{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tick{width:28px;height:28px;border-radius:999px;border:2px solid rgba(255,255,255,.6);flex:none;display:flex;align-items:center;justify-content:center}
.trow[aria-pressed="true"]{background:rgba(255,255,255,.26)}
.trow[aria-pressed="true"] .tx{opacity:.7;text-decoration:line-through;text-decoration-thickness:1.5px}
.trow[aria-pressed="true"] .tick{background:#FFE9A8;border-color:#FFE9A8}
.trow[aria-pressed="true"] .tick::after{content:"";width:7px;height:13px;border:solid #3C2566;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.hfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:14px}
.hfoot b{font-size:18px;font-weight:700}
.hbtn{height:40px;padding:0 16px;border-radius:999px;border:0;background:#FFE9A8;color:#3C2566;font-weight:700}
.hint{font-size:13px;opacity:.85}

/* 월 이동 */
.month{display:flex;align-items:center;gap:8px}
.month .lbl{flex:1;text-align:center;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.sq{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;padding:0}
.pill{height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700}

/* 요약 */
.summary{display:flex;align-items:center;gap:16px;padding:16px}
.donut{position:relative;width:112px;height:112px;flex:none}
.donut svg{width:100%;height:100%;display:block}
.donut .trk{stroke:var(--lav)}
.donut .val{stroke:var(--accent);transition:stroke-dasharray .35s ease}
.donut .pc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.donut .pc b{font-size:28px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:1px}
.stats{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--lav);border-radius:12px;padding:8px 4px;text-align:center;min-width:0}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.sumbtn{grid-column:1/-1;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--accent)}

/* 달력 표 */
.board{overflow:hidden}
.bhead{display:flex;align-items:baseline;justify-content:space-between;padding:14px 14px 10px;gap:8px}
.bhead h2{font-size:16px;font-weight:700}
.bhead small{color:var(--muted);font-size:12px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
th,td{padding:0;text-align:center;font-weight:400}
th.hn{position:sticky;left:0;z-index:3;background:var(--surface);width:128px;min-width:128px;max-width:128px;text-align:left;border-right:1px solid var(--line)}
th.wkl,th.wk{background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;height:26px}
th.wkl{padding:0 10px}
th.wk{border-left:1px solid var(--surface)}
th.wd{font-size:11px;color:var(--muted);height:22px;min-width:36px}
th.wd.sun{color:var(--danger)}
th.dn{font-size:13px;font-weight:700;height:28px;min-width:36px}
th.dn span{display:inline-block;min-width:24px;line-height:24px;border-radius:999px}
th.dn.today span{background:var(--accent);color:var(--on-accent)}
.barrow th.hn{vertical-align:bottom;padding:0 10px 8px;font-size:12px;font-weight:700;color:var(--muted);height:92px}
.barrow td{height:92px;padding:6px 7px 0;border-top:1px solid var(--line)}
.bw{height:80px;display:flex;align-items:flex-end}
.bw i{display:block;width:100%;background:linear-gradient(180deg,var(--hero-a),var(--accent));border-radius:5px 5px 0 0}
.bw i.zero{background:var(--lav)}
tr.hrow th.hn,tr.hrow td{border-top:1px solid var(--line);height:44px}
td.today{background:var(--lav)}
.hname{display:flex;align-items:center;gap:6px;width:100%;height:44px;padding:0 10px;border:0;background:transparent;text-align:left;font-weight:700;font-size:14px}
.hname .em{flex:none;font-size:16px}
.hname .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck{display:flex;align-items:center;justify-content:center;width:26px;height:26px;margin:0 auto;border-radius:8px;border:1.5px solid var(--lav2);background:transparent;padding:0}
.ck[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.ck[aria-pressed="true"]::after{content:"";display:block;width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.empty{padding:26px 16px;color:var(--muted);text-align:left}
.bfoot{margin:0;padding:10px 14px 14px;font-size:12px;color:var(--muted)}

.add{height:50px;border-radius:16px;border:1.5px dashed var(--accent);background:transparent;color:var(--accent);font-weight:700}

/* 분석 */
.analysis{padding:14px}
.analysis h2{font-size:16px;font-weight:700;margin-bottom:6px}
.arow{padding:12px 0;border-top:1px solid var(--line)}
.arow.first{border-top:0}
.atop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.an{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.av b{color:var(--ink);font-weight:700}
.abar{display:flex;align-items:center;gap:10px;margin-top:8px}
.trk2{flex:1;height:12px;background:var(--lav);border-radius:999px;overflow:hidden}
.trk2 i{display:block;height:100%;background:linear-gradient(90deg,var(--hero-a),var(--accent));border-radius:999px;transition:width .3s ease}
.abar em{font-style:normal;font-weight:700;font-size:13px;min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:center}
.link{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:13px;padding:8px}

/* 알림 바 */
.alarm{display:flex;align-items:center;gap:10px;padding:12px 14px}
.al-t{flex:1;min-width:0}
.al-t b{display:block;font-size:15px;font-weight:600;white-space:nowrap}
.al-t small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al-ic{width:36px;height:36px;border-radius:12px;background:var(--lav);display:flex;align-items:center;justify-content:center;flex:none}
.al-ic svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.timeinp.sm{height:38px;font-size:15px;font-weight:600;padding:0 8px;border-radius:10px;width:auto}
.timeinp:disabled{opacity:.45}
input.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:var(--lav2);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
input.sw:checked{background:var(--accent)}
input.sw:checked::after{transform:translateX(20px)}
.credit{text-align:center;font-size:12px;color:var(--muted);line-height:1.7;padding:6px 0 4px}
.credit b{font-weight:600;color:var(--ink)}
.credit a{color:inherit;text-decoration:none;font-variant-numeric:tabular-nums}

/* 잠금 화면 */
.lock{min-height:100vh;padding:max(24px,env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom));background:radial-gradient(90% 50% at 90% -5%,rgba(110,72,168,.28),transparent 60%),radial-gradient(70% 40% at -10% 100%,rgba(110,72,168,.18),transparent 60%),var(--bg)}
.lock-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.logo{width:64px;height:64px;border-radius:20px;font-size:24px}
.lock h1{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.2;text-wrap:balance}
.lock .sub{color:var(--muted)}
.lcard{padding:16px;display:flex;flex-direction:column;gap:12px}
.lcard h2{font-size:16px;font-weight:700}
.devrow{display:flex;align-items:center;gap:10px;background:var(--lav);border-radius:14px;padding:10px 12px}
.devrow code{flex:1;font:600 22px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em}
.mini{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--lav2);background:transparent;font-weight:700}
.pchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.inp{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:16px}
textarea.inp{min-height:84px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all}
.big{height:52px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--on-hero);font-weight:700;font-size:16px}
.ghost{height:48px;border-radius:14px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700}
.msg{font-size:13px;min-height:19px;color:var(--muted)}
.msg.bad{color:var(--danger)}
.msg.good{color:var(--accent);font-weight:700}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.note{font-size:12px;color:var(--muted)}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(20,10,35,.55);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));z-index:31;display:none;max-height:92%;overflow:auto}
.on{display:block}
.sheet h2{font-size:18px;font-weight:700;margin-bottom:12px}
.sheet h3{font-size:14px;font-weight:700;margin:16px 0 8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label,.lab{font-size:13px;color:var(--muted)}
.emchips{display:flex;flex-wrap:wrap;gap:6px}
.emchip{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:20px;padding:0}
.emchip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.row{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.warn{color:var(--danger);border-color:var(--danger)}
.btn.sm{flex:none;width:52px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--muted)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}

.timeinp{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:18px;font-weight:700}
.linkbtn{display:flex;align-items:center;justify-content:center;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;text-decoration:none;color:var(--ink);width:100%}
.stack{display:flex;flex-direction:column;gap:8px}
.stack>.btn,.stack>.big,.stack>.ghost,.stack>.linkbtn{flex:none}
.cele{text-align:center}
.cele img{width:100%;max-width:300px;border-radius:14px;border:1px solid var(--line);display:block;margin:6px auto 12px}
.remrow{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:6px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg);text-align:left;margin-bottom:8px}
.remrow .em{font-size:20px}
.remrow .tx{flex:1;font-weight:700}
.remrow .tick{width:26px;height:26px;border-radius:999px;border:2px solid var(--lav2)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:50;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
@media (max-width:420px){
  .summary{gap:12px;padding:14px}
  .donut{width:98px;height:98px}
  .donut .pc b{font-size:24px}
  .hero h2{font-size:22px}
}
@media (prefers-reduced-motion: reduce){
  .confetti{display:none}
  .pbar i,.donut .val,.trk2 i{transition:none}
}
</style>
</head>
<body>
<div id="lock" class="lock" hidden></div>
<main id="main" class="wrap" hidden>
  <header class="top">
    <h1>가앤 루틴 달력</h1>
    <button class="plan" id="planBtn" data-act="settings"></button>
    <button class="gear" data-act="settings" aria-label="설정">⚙</button>
  </header>
  <section class="hero" id="hero" aria-label="오늘의 미션"></section>
  <section class="card alarm" id="alarmBar" aria-label="알람 설정"></section>
  <nav class="month" aria-label="월 이동">
    <button class="sq" id="prev" aria-label="이전 달">‹</button>
    <div class="lbl" id="monthLabel"></div>
    <button class="sq" id="next" aria-label="다음 달">›</button>
    <button class="pill" id="goToday" hidden>이번 달</button>
  </nav>
  <section class="card summary" id="summary" aria-label="월 요약"></section>
  <section class="card board" aria-label="루틴 체크 달력">
    <div class="bhead"><h2>체크 달력</h2><small>칸을 눌러 체크하세요</small></div>
    <div class="scroll" id="scroll"></div>
    <p class="bfoot">처음 들어 있는 루틴은 예시예요. 루틴 이름을 누르면 이름·아이콘을 바꾸거나 지울 수 있어요.</p>
  </section>
  <button class="add" data-act="add">+ 루틴 추가</button>
  <section class="card analysis" id="analysis" aria-label="루틴별 분석"></section>
  <div class="foot"><button class="link" data-act="settings">설정 · 알림 · 백업 · 사용 기간</button></div>
  <footer class="credit"><b>가앤</b>이 만든 앱 · 문의 <a href="tel:01081868816">010-8186-8816</a></footer>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<div class="confetti" id="confetti" hidden></div>

<script>
// ==PURE==
var WD=['일','월','화','수','목','금','토'];
function pad(n){return n<10?'0'+n:''+n;}
function daysIn(y,m){return new Date(y,m+1,0).getDate();}
function keyOf(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d);}
function isOn(state,id,key){return (state.checks[key]||[]).indexOf(id)>=0;}
function allDone(state,key){return state.habits.length>0&&state.habits.every(function(h){return isOn(state,h.id,key);});}
function calcStats(state,y,m){
  var N=daysIn(y,m), H=state.habits.length;
  var per=state.habits.map(function(h){return {id:h.id,actual:0,goal:N,remain:N,pct:0};});
  var idx={};
  per.forEach(function(p,i){idx[p.id]=i;});
  var daily=[], done=0;
  for(var d=1;d<=N;d++){
    var arr=state.checks[keyOf(y,m,d)]||[], c=0;
    arr.forEach(function(id){ if(idx[id]!==undefined){ per[idx[id]].actual++; c++; } });
    done+=c;
    daily.push({d:d,count:c,pct:H?Math.round(c/H*100):0});
  }
  per.forEach(function(p){ p.remain=p.goal-p.actual; p.pct=p.goal?Math.round(p.actual/p.goal*100):0; });
  var total=H*N;
  return {N:N,H:H,per:per,daily:daily,done:done,total:total,remain:total-done,pct:total?Math.round(done/total*100):0};
}
function calcStreak(state,today){
  var d=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  if(!allDone(state,keyOf(d.getFullYear(),d.getMonth(),d.getDate()))) d.setDate(d.getDate()-1);
  var n=0;
  while(n<3660&&allDone(state,keyOf(d.getFullYear(),d.getMonth(),d.getDate()))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function todayYmd(dt){return dt.getFullYear()*10000+(dt.getMonth()+1)*100+dt.getDate();}
function ymdToDate(n){return new Date(Math.floor(n/10000),Math.floor(n/100)%100-1,n%100);}
function daysLeft(expYmd,now){return Math.round((ymdToDate(expYmd)-ymdToDate(todayYmd(now)))/86400000);}
function fmtYmd(n){return Math.floor(n/10000)+'.'+pad(Math.floor(n/100)%100)+'.'+pad(n%100);}
// 알림용 주소·파일 만들기
function reminderStart(now,hh,mm){
  var s=new Date(now.getFullYear(),now.getMonth(),now.getDate(),hh,mm,0);
  if(s<=now) s.setDate(s.getDate()+1);
  return s;
}
function stamp(dt){return dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate())+'T'+pad(dt.getHours())+pad(dt.getMinutes())+'00';}
function gcalUrl(now,hh,mm,title,details){
  var s=reminderStart(now,hh,mm), e=new Date(s.getTime()+15*60000);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+
    '&dates='+stamp(s)+'/'+stamp(e)+'&details='+encodeURIComponent(details)+'&recur='+encodeURIComponent('RRULE:FREQ=DAILY')+'&ctz=Asia%2FSeoul';
}
function icsText(now,hh,mm,title,details,uid){
  var s=reminderStart(now,hh,mm), e=new Date(s.getTime()+15*60000);

  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Gaan//Routine//KO','BEGIN:VEVENT',
    'UID:'+uid,'DTSTAMP:'+now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+'00Z','DTSTART:'+stamp(s),'DTEND:'+stamp(e),'RRULE:FREQ=DAILY',
    'SUMMARY:'+esc(title),'DESCRIPTION:'+esc(details),
    'BEGIN:VALARM','TRIGGER:PT0S','ACTION:DISPLAY','DESCRIPTION:'+esc(title),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}

  var pc=t.closest('.pchip'); if(pc){ period=pc.getAttribute('data-period'); document.querySelectorAll('.pchip').forEach(function(b){ b.setAttribute('aria-pressed',String(b.getAttribute('data-period')===period)); }); return; }
  var ec=t.closest('.emchip'); if(ec){ picked=ec.getAttribute('data-e'); $('fEmoji').value=picked; $('emchips').innerHTML=chipsHtml(); return; }
  var a=t.closest('[data-act]'); if(!a) return;
  var act=a.getAttribute('data-act');
  if(act==='settings') openSettings();
  else if(act==='add') openHabit(null);
  else if(act==='close') closeSheet();
  else if(act==='copydev'){ copyText(DEV); toast('기기번호를 복사했어요'); }
  else if(act==='sendreq') sendRequest();
  else if(act==='recheck'){
    var msg=document.querySelector('.codeMsg'); if(msg){ msg.className='msg codeMsg'; msg.textContent='확인 중…'; }
    a.disabled=true;
    var ok=await refreshLicense();
    a.disabled=false;
    if(!ok){ if(msg){ msg.className='msg codeMsg bad'; msg.textContent='확인하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.'; } return; }
    if(isActive()){ toast(licStatus()); closeSheet(); render(); scrollToToday(); }
    else if(msg){ msg.className='msg codeMsg bad'; msg.textContent=licStatus(); }
  }
  else if(act==='savehabit'){
    var name=$('fName').value.trim(), emoji=$('fEmoji').value.trim();
    if(!name){ $('fErr').textContent='루틴 이름을 입력해 주세요.'; $('fName').focus(); return; }
    if(editing) state.habits.forEach(function(x){ if(x.id===editing){ x.name=name; x.emoji=emoji; } });
    else { if(state.habits.length>=20){ $('fErr').textContent='루틴은 최대 20개까지 만들 수 있어요.'; return; }
      state.habits.push({id:'h'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),name:name,emoji:emoji}); }
    closeSheet(); save(); render();
  }
  else if(act==='up'||act==='down'){
    var i=-1; state.habits.forEach(function(x,k){ if(x.id===editing) i=k; });
    var j=i+(act==='up'?-1:1); if(i<0||j<0||j>=state.habits.length) return;
    var tmp=state.habits[i]; state.habits[i]=state.habits[j]; state.habits[j]=tmp; save(); render();
  }
  else if(act==='delhabit'){
    if(!delArmed){ delArmed=true; $('delBtn').textContent='정말 삭제할까요? 한 번 더'; return; }
    state.habits=state.habits.filter(function(x){ return x.id!==editing; }); closeSheet(); save(); render();
  }
  else if(act==='shareToday') openShare('today','오늘 미션 완료!');
  else if(act==='shareMonth') openShare('month',(view.m+1)+'월 결과 공유');
  else if(act==='doshare') doShare();
  else if(act==='saveimg') saveImg();
  else if(act==='copycap'){ copyText(lastText); toast('문구를 복사했어요'); }
  else if(act==='copybackup'){ copyText(JSON.stringify({app:'gaan-routine',v:1,habits:state.habits,checks:state.checks})); toast('백업을 복사했어요. 메모장 등에 붙여 두세요'); }
  else if(act==='restore'){
    var rb=$('restoreBox'), rm=$('restoreMsg'), o=null;
    try{ o=JSON.parse(rb.value); }catch(er){}
    if(!o||o.app!=='gaan-routine'||!Array.isArray(o.habits)){ rm.className='msg bad'; rm.textContent='백업 내용이 맞지 않아요. 복사한 내용을 그대로 붙여 넣어 주세요.'; return; }
    if(a.getAttribute('data-armed')!=='1'){ a.setAttribute('data-armed','1'); a.textContent='현재 기록이 바뀌어요. 한 번 더 누르면 복원'; return; }
    state=normalize(o); save(); closeSheet(); render(); toast('복원했어요');
  }
  else if(act==='skiptoday'){ var d=new Date(); d.setHours(24,0,0,0); snoozeUntil=d.getTime(); closeSheet(); }
  else if(act==='snooze'){ snoozeUntil=Date.now()+30*60000; closeSheet(); toast('30분 뒤에 다시 알려드릴게요'); }
  else if(act==='ics'){
    try{
      var blob=new Blob([reminderLinks().ics],{type:'text/calendar;charset=utf-8'}), ln=document.createElement('a');
      ln.href=URL.createObjectURL(blob); ln.download='gaan-routine-reminder.ics'; document.body.appendChild(ln); ln.click(); document.body.removeChild(ln);
      toast('파일을 받은 뒤 눌러서 캘린더에 추가해 주세요');
    }catch(er){ toast('파일 저장이 막혔어요. 구글 캘린더 버튼을 써 주세요'); }
  }
  else if(act==='alarm'&&APP&&window.GaanApp.setClockAlarm){ var tp=prefs.time.split(':'); try{ window.GaanApp.setClockAlarm(+tp[0],+tp[1],'루틴 체크: 남은 루틴 확인'); }catch(er){ toast('시계 앱을 열 수 없어요'); } }
  else if(act==='alarm'){ try{ location.href=reminderLinks().intent; toast('시계 앱이 열리지 않으면 캘린더 알림을 써 주세요'); }catch(er){ toast('이 기기에서는 열 수 없어요'); } }
});
document.addEventListener('change',function(e){
  if(e.target.id==='remOn'||e.target.id==='remOn2'){ prefs.on=e.target.checked; renderAlarm(); var o1=$('remOn'); if(o1) o1.checked=prefs.on; savePrefs(); appSync(); toast(prefs.on?'알람을 켰어요':'알람을 껐어요'); }
  if((e.target.id==='remTime'||e.target.id==='remTime2')&&/^\d\d:\d\d$/.test(e.target.value)){ prefs.time=e.target.value; renderAlarm(); var t1=$('remTime'); if(t1) t1.value=prefs.time; savePrefs(); var l=$('gcalLink'); if(l) l.href=reminderLinks().g; appSync(); toast('알람 시간을 '+prefs.time+'으로 바꿨어요'); }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&sheetOpen) closeSheet();
  if(e.key==='Enter'&&e.target.id==='fName'){ e.preventDefault(); var b=document.querySelector('[data-act="savehabit"]'); if(b) b.click(); }
});
$('scrim').addEventListener('click',closeSheet);
function move(dl){ var m=view.m+dl,y=view.y; if(m<0){m=11;y--;} else if(m>11){m=0;y++;} view={y:y,m:m}; render(); scrollToToday(); }
$('prev').addEventListener('click',function(){move(-1);});
$('next').addEventListener('click',function(){move(1);});
$('goToday').addEventListener('click',function(){ view={y:today.y,m:today.m}; render(); scrollToToday(); });
document.addEventListener('visibilitychange',function(){
  if(document.hidden) return;
  var n=new Date();
  if(n.getDate()!==today.d||n.getMonth()!==today.m||n.getFullYear()!==today.y){ today={y:n.getFullYear(),m:n.getMonth(),d:n.getDate()}; view={y:today.y,m:today.m}; render(); scrollToToday(); }
  checkReminder();
});
setInterval(function(){ var n=new Date(); if(n.getDate()!==today.d){ today={y:n.getFullYear(),m:n.getMonth(),d:n.getDate()}; render(); } checkReminder(); },30000);

function start(){ if(isActive()){ renderApp(); scrollToToday(); setTimeout(checkReminder,1200); } else renderLock(); }
(async function boot(){
  if(isActive()){ start(); refreshLicense().then(function(ok){ if(ok&&!isActive()) render(); }); return; }
  if(!PREVIEW){ $('lock').hidden=false; $('lock').innerHTML='<div class="lock-in"><p class="sub">사용 기간 확인 중…</p></div>'; await refreshLicense(); }
  start();
})();
document.addEventListener('visibilitychange',function(){
  if(document.hidden||PREVIEW) return;
  if(!lic||Date.now()-lic.checked>15*60000){ var was=isActive(); refreshLicense().then(function(ok){ if(ok&&isActive()!==was) render(); }); }
});
})();
</script>
</body>
</html>
