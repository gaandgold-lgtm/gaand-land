<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>콜명함 사용코드 등록</title>
<style>
:root{--b:#24408E;--bg:#F5F6FA;--ink:#1B1E28;--line:#D9DDE8}
@media (prefers-color-scheme:dark){:root{--bg:#14161C;--ink:#ECEEF3;--line:#333A48}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:18px;padding:28px 16px}
.w{max-width:480px;margin:0 auto}h1{font-size:24px}
a.b,button{display:flex;align-items:center;justify-content:center;width:100%;min-height:64px;border-radius:16px;font:inherit;font-weight:800;font-size:20px;text-decoration:none;border:0;margin:14px 0;box-sizing:border-box}
a.b{background:var(--b);color:#fff}button{background:transparent;color:var(--b);border:2px solid var(--b)}
code{display:block;word-break:break-all;background:rgba(127,127,127,.12);padding:12px;border-radius:12px;font-size:14px}
p{line-height:1.6}
</style>
</head>
<body><div class="w">
<h1>콜명함 사용코드 등록</h1>
<p>아래 버튼을 누르면 콜명함 앱이 열리면서 바로 등록돼요.</p>
<a class="b" id="go" href="#">콜명함에서 등록하기</a>
<p>앱이 안 열리면 코드를 복사해서 앱의 <b>사용 코드 붙여넣기</b> 칸에 넣고 <b>사용 코드 등록</b>을 누르세요.</p>
<code id="c"></code>
<button id="cp">코드 복사</button>
</div>
<script>
var c=(location.hash||'').replace(/^#/,'').replace(/[^A-Za-z0-9_-]/g,'');
document.getElementById('c').textContent=c||'(코드가 없어요. 받은 문자의 링크를 다시 눌러주세요)';
document.getElementById('go').href='intent://activate?c='+c+'#Intent;scheme=callcard;package=kr.gaand.callcard;end';
document.getElementById('cp').onclick=function(){var b=this;function done(){b.textContent='복사됐어요 ✓'}
 if(navigator.clipboard)navigator.clipboard.writeText(c).then(done,function(){});else{var t=document.createElement('textarea');t.value=c;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();done()}};
</script>
</body>
</html>
